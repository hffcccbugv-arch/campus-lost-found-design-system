<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><title>Wireframe: report.html (Report an item)</title><desc>Low-fidelity wireframe at 320 px and 1400 px</desc><rect width="1000" height="560" fill="#FAF8F4"/><text x="20" y="30" font-family="sans-serif" font-size="18" font-weight="700" fill="#1B1F24">Wireframe: report.html (Report an item)</text><text x="20" y="56" font-family="sans-serif" font-size="14" fill="#4A5560">320 px: one column</text><rect x="20" y="70" width="250" height="50" fill="#E9EEF2" stroke="#4A5560" stroke-width="2"/><text x="28" y="92" font-family="sans-serif" font-size="14" fill="#1B1F24">Header: title + nav</text><rect x="20" y="130" width="250" height="40" fill="#FFFFFF" stroke="#4A5560" stroke-width="2"/><text x="28" y="152" font-family="sans-serif" font-size="14" fill="#1B1F24">Skip link</text><rect x="20" y="180" width="250" height="40" fill="#FFFFFF" stroke="#4A5560" stroke-width="2"/><text x="28" y="202" font-family="sans-serif" font-size="14" fill="#1B1F24">Heading: Report an item</text><rect x="20" y="230" width="250" height="150" fill="#E9EEF2" stroke="#4A5560" stroke-width="2"/><text x="28" y="252" font-family="sans-serif" font-size="14" fill="#1B1F24">Fieldset: Item, Where, Date</text><rect x="20" y="390" width="250" height="50" fill="#FFFFFF" stroke="#4A5560" stroke-width="2"/><text x="28" y="412" font-family="sans-serif" font-size="14" fill="#1B1F24">Radios: lost / found</text><rect x="20" y="450" width="250" height="40" fill="#E9EEF2" stroke="#4A5560" stroke-width="2"/><text x="28" y="472" font-family="sans-serif" font-size="14" fill="#1B1F24">Send demo + Clear (.btn)</text><rect x="20" y="500" width="250" height="40" fill="#E9EEF2" stroke="#4A5560" stroke-width="2"/><text x="28" y="522" font-family="sans-serif" font-size="14" fill="#1B1F24">Aside: next, footer</text><text x="320" y="56" font-family="sans-serif" font-size="14" fill="#4A5560">1400 px: main 8 columns, aside 4</text><rect x="320